<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151515"><meta name="description" content="COLONY QR Super Admin">
<title>لوحة الإدارة — COLONY QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#151515;--panel:#202020;--panel2:#252525;--gold:#c8a45d;--ivory:#f5f1e8;--muted:#aaa49a;--line:rgba(245,241,232,.11);--red:#ef8e83;--green:#8bd4aa;--blue:#a9ddf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font:14px Cairo,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;gap:16px;background:#191919}.brand{font:800 19px 'DM Sans',sans-serif;letter-spacing:1px;direction:ltr}.brand span{color:var(--gold)}.actions{display:flex;gap:10px;align-items:center}.lang,.btn{border:1px solid var(--line);background:#242424;color:var(--ivory);padding:9px 13px;border-radius:9px}.btn.gold{background:var(--gold);color:#171511;border-color:var(--gold);font-weight:800}.btn.danger{color:var(--red)}.wrap{max-width:1250px;margin:auto;padding:34px 24px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.eyebrow{color:var(--blue);font:800 11px 'DM Sans';letter-spacing:1.8px;direction:ltr}h1{font-size:30px;margin:7px 0}.sub{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:19px}.stat small{color:var(--muted)}.stat strong{display:block;font:800 29px 'DM Sans';margin-top:9px;color:var(--gold);direction:ltr;text-align:right}.panel{padding:20px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h2{font-size:17px;margin:0}.search{display:flex;gap:9px;flex-wrap:wrap}.search input{min-width:230px;flex:1;background:#151515;border:1px solid var(--line);color:var(--ivory);padding:11px 13px;border-radius:9px;outline:none}.search input:focus{border-color:var(--gold)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:right;padding:13px 11px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:12px;font-weight:700}td{font-size:13px}td.email{direction:ltr;text-align:right;font-family:'DM Sans',sans-serif}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#30302b;color:var(--gold);font-size:11px}.pill.active{color:var(--green);background:#20352a}.pill.suspended{color:var(--red);background:#3a2422}.rowactions{display:flex;gap:7px}.rowactions button{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:#302b23;color:var(--gold);white-space:nowrap}.rowactions button.suspend{color:var(--red)}.state{padding:25px;text-align:center;color:var(--muted)}.message{padding:12px;border-radius:9px;margin-bottom:15px;display:none}.message.error{display:block;background:#482727;color:#ffdada}.message.ok{display:block;background:#203d31;color:#d7ffe9}.footer{color:#77736c;text-align:center;padding:15px;font-size:12px}.hidden{display:none!important}
[dir=ltr]body{font-family:'DM Sans',Arial,sans-serif}[dir=ltr]th,[dir=ltr]td{text-align:left}[dir=ltr]td.email{text-align:left}[dir=ltr] .stat strong{text-align:left}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.heading{align-items:flex-start;flex-direction:column}.wrap{padding:24px 15px}.top{padding:0 15px}}
@media(max-width:450px){.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat strong{font-size:24px}.top{height:62px}.brand{font-size:16px}}
</style></head>
<body>
<header class="top"><a class="brand" href="index.html" style="text-decoration:none;color:var(--ivory)">COLONY <span>QR</span> <small style="font:600 11px Cairo;color:var(--muted);letter-spacing:0"> • ADMIN</small></a><div class="actions"><select id="language" class="lang" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option></select><button id="logout" class="btn">تسجيل الخروج</button></div></header>
<main class="wrap">
<div id="message" class="message" role="status"></div>
<div class="heading"><div><div class="eyebrow">SUPER ADMIN CONTROL CENTER</div><h1 data-i18n="title">لوحة الإدارة</h1><p class="sub" data-i18n="subtitle">إدارة منصة COLONY QR والمستخدمين.</p></div><div id="adminIdentity" class="sub"></div></div>
<section class="stats">
<div class="stat"><small data-i18n="totalUsers">إجمالي المستخدمين</small><strong id="usersCount">—</strong></div>
<div class="stat"><small data-i18n="activeUsers">الحسابات النشطة</small><strong id="activeCount">—</strong></div>
<div class="stat"><small data-i18n="suspendedUsers">الحسابات الموقوفة</small><strong id="suspendedCount">—</strong></div>
<div class="stat"><small data-i18n="totalQr">رموز QR المحفوظة</small><strong id="qrCount">—</strong></div>
</section>
<section class="panel"><div class="panelhead"><h2 data-i18n="usersTitle">إدارة المستخدمين</h2><button class="btn gold" id="refresh">تحديث البيانات</button></div>
<div class="search"><input id="search" type="search" placeholder="ابحث بالبريد أو الاسم..." autocomplete="off"><button class="btn" id="searchBtn">بحث</button></div>
<div class="tablewrap"><table><thead><tr><th data-i18n="name">الاسم</th><th>Email</th><th data-i18n="role">الصلاحية</th><th data-i18n="status">الحالة</th><th data-i18n="joined">تاريخ التسجيل</th><th data-i18n="actions">الإجراءات</th></tr></thead><tbody id="usersBody"><tr><td colspan="6" class="state">جارٍ تحميل البيانات...</td></tr></tbody></table></div>
<div id="listState" class="state hidden"></div>
</section>
<div class="footer" data-i18n="footer">تُسجّل الإجراءات الإدارية في سجل التدقيق.</div>
</main>
<script>
const API="https://colony-qr-api.colonyus666.workers.dev", $=id=>document.getElementById(id);
const dict={
ar:{title:"لوحة الإدارة",subtitle:"إدارة منصة COLONY QR والمستخدمين.",totalUsers:"إجمالي المستخدمين",activeUsers:"الحسابات النشطة",suspendedUsers:"الحسابات الموقوفة",totalQr:"رموز QR المحفوظة",usersTitle:"إدارة المستخدمين",refresh:"تحديث البيانات",search:"بحث بالبريد أو الاسم...",name:"الاسم",role:"الصلاحية",status:"الحالة",joined:"تاريخ التسجيل",actions:"الإجراءات",logout:"تسجيل الخروج",loading:"جارٍ تحميل البيانات...",empty:"لا يوجد مستخدمون مطابقون.",active:"نشط",suspended:"موقوف",user:"مستخدم",super_admin:"مدير عام",moderator:"مشرف",admin:"مدير",suspend:"إيقاف",reactivate:"إعادة التفعيل",confirmSuspend:"هل تريد إيقاف هذا الحساب؟",confirmReactivate:"هل تريد إعادة تفعيل هذا الحساب؟",failed:"تعذر تحميل البيانات. تحقق من اتصال الخادم.",forbidden:"ليس لديك صلاحية الوصول إلى لوحة الإدارة.",footer:"تُسجّل الإجراءات الإدارية في سجل التدقيق.",updated:"تم تحديث حالة الحساب.",actionFailed:"تعذر تنفيذ العملية."},
en:{title:"Admin dashboard",subtitle:"Manage COLONY QR and its users.",totalUsers:"Total users",activeUsers:"Active accounts",suspendedUsers:"Suspended accounts",totalQr:"Saved QR codes",usersTitle:"User management",refresh:"Refresh data",search:"Search by email or name...",name:"Name",role:"Role",status:"Status",joined:"Joined",actions:"Actions",logout:"Log out",loading:"Loading data...",empty:"No matching users.",active:"Active",suspended:"Suspended",user:"User",super_admin:"Super Admin",moderator:"Moderator",admin:"Admin",suspend:"Suspend",reactivate:"Reactivate",confirmSuspend:"Suspend this account?",confirmReactivate:"Reactivate this account?",failed:"Could not load data. Check the server connection.",forbidden:"You are not authorized to access this dashboard.",footer:"Administrative actions are recorded in the audit log.",updated:"Account status updated.",actionFailed:"Could not complete this action."}
};
let lang=localStorage.getItem("colony_qr_language")==="en"?"en":"ar", currentUser=null;
function tr(k){return dict[lang][k]||k}
function setLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=tr(e.dataset.i18n));$("language").value=lang;$("logout").textContent=tr("logout");$("refresh").textContent=tr("refresh");$("search").placeholder=tr("search");}
function message(text,type="error"){$("message").textContent=text;$("message").className="message "+type}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function api(path,opts={}){const r=await fetch(API+path,{credentials:"include",cache:"no-store",...opts});let d={};try{d=await r.json()}catch{}if(r.status===401){location.replace("auth.html");throw Error("auth")}if(r.status===403){message(tr("forbidden"));throw Error("forbidden")}if(!r.ok||d.success===false)throw Error(d.error||"request");return d;}
function formatDate(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString(lang==="ar"?"ar":"en",{year:"numeric",month:"short",day:"numeric"});}
async function loadOverview(){const d=await api("/api/admin/overview");const x=d.overview||d; $("usersCount").textContent=x.total_users??x.users??0;$("activeCount").textContent=x.active_users??0;$("suspendedCount").textContent=x.suspended_users??0;$("qrCount").textContent=x.total_qr_codes??x.qr_codes??0;}
async function loadUsers(){const body=$("usersBody");body.innerHTML='<tr><td colspan="6" class="state">'+tr("loading")+'</td></tr>';const term=$("search").value.trim();const d=await api("/api/admin/users?limit=100&offset=0&search="+encodeURIComponent(term));const users=d.users||[];if(!users.length){body.innerHTML='<tr><td colspan="6" class="state">'+tr("empty")+'</td></tr>';return;}
body.innerHTML=users.map(u=>{const isRoot=u.role==="super_admin";const suspended=u.status==="suspended";return '<tr><td>'+escapeHtml(u.display_name||"—")+'</td><td class="email">'+escapeHtml(u.email)+'</td><td><span class="pill">'+escapeHtml(tr(u.role||"user"))+'</span></td><td><span class="pill '+(suspended?"suspended":"active")+'">'+escapeHtml(tr(suspended?"suspended":"active"))+'</span></td><td>'+escapeHtml(formatDate(u.created_at))+'</td><td>'+(isRoot?'<span class="pill">Protected</span>':'<div class="rowactions"><button class="'+(suspended?"":"suspend")+'" data-id="'+escapeHtml(u.id)+'" data-status="'+(suspended?"active":"suspended")+'">'+escapeHtml(tr(suspended?"reactivate":"suspend"))+'</button></div>')+'</td></tr>';}).join("");
body.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>changeStatus(b.dataset.id,b.dataset.status,b)));}
async function refreshAll(){ $("usersBody").innerHTML='<tr><td colspan="6" class="state">'+tr("loading")+'</td></tr>';try{await Promise.all([loadOverview(),loadUsers()]);}catch(e){if(e.message!=="auth"&&e.message!=="forbidden")message(tr("failed"));}}
async function changeStatus(id,status,button){const confirmText=tr(status==="suspended"?"confirmSuspend":"confirmReactivate");if(!confirm(confirmText))return;button.disabled=true;try{await api("/api/admin/users/"+encodeURIComponent(id)+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});message(tr("updated"),"ok");await refreshAll();}catch(e){if(e.message!=="auth"&&e.message!=="forbidden")message(tr("actionFailed"));button.disabled=false;}}
async function init(){setLang();try{const d=await api("/api/auth/me");currentUser=d.user;if(!currentUser||currentUser.role!=="super_admin"){location.replace("dashboard.html");return;}$("adminIdentity").textContent=currentUser.email;await refreshAll();}catch(e){if(e.message!=="auth"&&e.message!=="forbidden")message(tr("failed"));}}
$("language").addEventListener("change",e=>{lang=e.target.value;localStorage.setItem("colony_qr_language",lang);setLang();if(currentUser)refreshAll();});
$("refresh").addEventListener("click",refreshAll);$("searchBtn").addEventListener("click",loadUsers);$("search").addEventListener("keydown",e=>{if(e.key==="Enter")loadUsers();});
$("logout").addEventListener("click",async()=>{try{await fetch(API+"/api/auth/logout",{method:"POST",credentials:"include"});}finally{location.replace("auth.html");}});
init();
</script></body></html>
