<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515">
<title>Business Page — COLONY QR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2eb;--ink:#24221e;--muted:#77736c;--gold:#b18b43;--card:#fff;--line:#e8e2d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Cairo,"DM Sans",sans-serif}.wrap{max-width:1000px;margin:auto;padding:0 18px 50px}.cover{height:270px;background:#29251f center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 65%)}.head{position:relative;background:var(--card);border-radius:18px;margin:-55px auto 20px;max-width:900px;padding:22px;display:flex;gap:18px;align-items:center;box-shadow:0 8px 35px #30271912;z-index:1}.logo{width:100px;height:100px;object-fit:cover;border-radius:15px;border:4px solid white;background:#eee}.identity{min-width:0}.identity h1{font-size:clamp(22px,4vw,32px);margin:0 0 4px}.category{color:var(--gold);font-weight:700;font-size:13px}.desc{color:var(--muted);line-height:1.9;margin:12px 0 0;white-space:pre-wrap}.contacts{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 26px}.contact{display:inline-flex;align-items:center;gap:7px;background:#24221e;color:white;padding:10px 15px;border-radius:9px;font-weight:700;font-size:13px}.contact.gold{background:var(--gold);color:#fff}.section{margin-top:26px}.section h2{font-size:21px;margin:0 0 15px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.item img{width:100%;height:190px;object-fit:cover;background:#eee}.itembody{padding:14px}.item h3{margin:0 0 6px;font-size:16px}.item p{margin:0;color:var(--muted);line-height:1.7;font-size:13px;white-space:pre-wrap}.price{display:block;margin-top:12px;color:var(--gold);font-weight:800}.address{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.9}.error{max-width:550px;margin:90px auto;background:white;padding:30px;border-radius:15px;text-align:center}.error h1{font-size:23px}.error p{color:var(--muted);line-height:1.8}.footer{text-align:center;color:#999;font-size:12px;margin-top:35px}@media(max-width:700px){.cover{height:190px}.head{margin-top:-38px;padding:16px;align-items:flex-start}.logo{width:76px;height:76px}.items{grid-template-columns:repeat(2,1fr)}.item img{height:145px}}@media(max-width:430px){.items{grid-template-columns:1fr}.item img{height:210px}.head{gap:12px}}
</style>
</head>
<body><div id="app"><div class="error"><h1>COLONY QR</h1><p>جارٍ تحميل الصفحة…</p></div></div>
<script>
const API="https://colony-qr-api.colonyus666.workers.dev";
const app=document.getElementById("app");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function phoneLink(v){return "tel:"+String(v||"").replace(/[^+0-9]/g,"")}
function whatsappLink(v){let n=String(v||"").replace(/\D/g,"");if(n.startsWith("0"))n="213"+n.slice(1);return "https://wa.me/"+n}
function render(d){const p=d.page,items=d.items||[];document.title=(p.title||"Business")+" — COLONY QR";const cover=p.cover_image_url?'style="background-image:url('+esc(p.cover_image_url)+')"':"";let contacts="";if(p.whatsapp)contacts+='<a class="contact gold" target="_blank" rel="noopener" href="'+esc(whatsappLink(p.whatsapp))+'">WhatsApp</a>';if(p.phone)contacts+='<a class="contact" href="'+esc(phoneLink(p.phone))+'">☎ '+esc(p.phone)+'</a>';if(p.email)contacts+='<a class="contact" href="mailto:'+esc(p.email)+'">✉ '+esc(p.email)+'</a>';if(p.website)contacts+='<a class="contact" target="_blank" rel="noopener" href="'+esc(p.website)+'">Website</a>';if(p.maps_url)contacts+='<a class="contact" target="_blank" rel="noopener" href="'+esc(p.maps_url)+'">⌖ Location</a>';const cards=items.length?items.map(i=>'<article class="item">'+(i.image_url?'<img loading="lazy" src="'+esc(i.image_url)+'" alt="'+esc(i.name)+'">':'')+'<div class="itembody"><h3>'+esc(i.name)+'</h3><p>'+esc(i.description||"")+'</p>'+(Number(i.price)>0?'<span class="price">'+esc(Number(i.price).toLocaleString())+' '+esc(i.currency||"DZD")+'</span>':'')+'</div></article>').join(""):'<div class="address">No products or services have been added yet.</div>';app.innerHTML='<div class="cover" '+cover+'></div><main class="wrap"><section class="head">'+(p.logo_url?'<img class="logo" src="'+esc(p.logo_url)+'" alt="">':'')+'<div class="identity"><div class="category">'+esc(p.business_category||"")+'</div><h1>'+esc(p.title)+'</h1></div></section>'+(p.description?'<p class="desc">'+esc(p.description)+'</p>':'')+'<nav class="contacts">'+contacts+'</nav><section class="section"><h2>Products & Services</h2><div class="items">'+cards+'</div></section>'+(p.address?'<section class="section"><h2>Find us</h2><div class="address">'+esc(p.address)+'</div></section>':'')+'<div class="footer">Powered by COLONY QR</div></main>'}
async function start(){const slug=new URLSearchParams(location.search).get("slug");if(!slug){app.innerHTML='<div class="error"><h1>Page not found</h1><p>Missing page address.</p></div>';return}try{const r=await fetch(API+"/api/public/digital-pages/"+encodeURIComponent(slug),{cache:"no-store"});const d=await r.json();if(!r.ok||!d.success)throw new Error("notfound");render(d)}catch(e){app.innerHTML='<div class="error"><h1>هذه الصفحة غير متاحة</h1><p>قد تكون الصفحة غير منشورة أو أن الرابط غير صحيح.</p><a href="index.html">COLONY QR</a></div>'}}
start();
</script></body></html>
